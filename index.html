<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CES 创新 & 变现峰会 | Innovation & Monetization Summit</title>
    
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react-dom": "https://esm.sh/react-dom@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
      :root {
        --gold: #FFC107;
        --gold-dark: #FFB300;
        --bg-black: #050505;
      }
      body {
        font-family: 'Inter', 'Noto Sans SC', sans-serif;
        background-color: var(--bg-black);
        color: white;
        scroll-behavior: smooth;
        background-image: radial-gradient(circle at 50% 50%, #1a150a 0%, #050505 100%);
      }
      .text-gold { color: var(--gold); }
      .bg-gold { background-color: var(--gold); }
      .border-gold { border-color: var(--gold); }
      
      .glass-card {
        background: rgba(255, 255, 255, 0.015);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(212, 175, 55, 0.08);
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .glass-card:hover {
        border-color: rgba(212, 175, 55, 0.25);
        background: rgba(255, 255, 255, 0.03);
        transform: translateY(-4px);
      }
      
      .gold-btn {
        background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
        color: black;
        font-weight: 800;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
      }
      .gold-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
      }
      
      .outline-gold-btn {
        border: 1px solid var(--gold);
        color: var(--gold);
        font-weight: 700;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
      }
      .outline-gold-btn:hover {
        background: rgba(212, 175, 55, 0.1);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
      }

      /* Removed city grid accent - using solid black background */
      .city-accent {
        background: transparent;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fade-in 0.5s ease forwards;
      }
    </style>
  </head>
  <body>
    <div id="root" class="city-accent"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
